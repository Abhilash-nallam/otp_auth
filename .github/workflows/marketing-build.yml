name: Marketing Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/marketing/**"
      - "packages/email-editor/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/marketing-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketing-build:
    name: Build marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site and workspace dependencies
        run: pnpm build:marketing
